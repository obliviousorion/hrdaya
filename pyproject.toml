[project]
name = "mlee-ecg-biometrics"
version = "0.1.0"
description = "Recording-disjoint ECG-ID biometric baseline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "torch>=2.0.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
[tool.uv]
package = false
[tool.ruff]
line-length = 100
extend-exclude = ["private", "data", ".uv-cache", ".venv"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"src/mlee/baseline.py" = ["E731"]
