name: Synthetic ECG checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: make setup
      - run: make lint
      - run: make test
      - run: uvx --from pre-commit==4.3.0 pre-commit run --all-files
